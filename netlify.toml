# Header security sebelumnya ada di .htaccess (Apache), tapi Netlify mengabaikan file Apache.
# Netlify sudah otomatis: Brotli/gzip compression dan redirect HTTP->HTTPS.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache dipersingkat untuk konten yang sering berubah; Netlify default = must-revalidate.
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
